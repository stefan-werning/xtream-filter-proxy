upstream:
  base_url: "http://provider.example:8080"
  username: "your_username"
  password: "your_password"
  timeout_seconds: 20
  user_agent: "Smarters Pro"

# Informational only -- the actual listen address/port come from how uvicorn
# is started (docker-compose.yml's "ports:" mapping, or the --port flag).
server:
  host: "0.0.0.0"
  port: 8080

database:
  path: "./data/proxy.db"

# ffprobe fallback: when the provider API doesn't report audio tracks for a
# title, open the stream and read them directly. More accurate, but each
# check uses one of the account's connection slots for a few seconds.
# Requires the ffprobe binary (from FFmpeg) on the host / in the image.
ffprobe:
  enabled: true
  timeout_seconds: 25
  binary: "ffprobe"

crawler:
  request_delay_seconds: 1.0
  # How many of the account's connections to keep free for your own live
  # viewing. If the account allows only one connection, set this to 0 --
  # otherwise the crawler can never run ffprobe (0 slots left) and falls
  # back to API metadata only. With 0, an ffprobe check may briefly collide
  # with a live stream; the crawler still skips ffprobe while a slot is
  # actually in use.
  reserve_slots: 0
  slot_recheck_seconds: 60
  # Minimum gap between two ffprobe runs. IPTV panels don't always release
  # a stream connection the instant ffprobe disconnects -- firing the next
  # one too soon can hit the connection limit (HTTP 458, seen as ffprobe
  # exit 1). Raise it if you still see those; lower it (even to 0) if your
  # panel frees connections quickly.
  ffprobe_cooldown_seconds: 15
  sync_interval_minutes: 360
  purge_after_days: 30
  log_max_age_days: 30
  log_max_rows: 5000

crawl_schedule:
  enabled: true
  windows:
    - days: [mon, tue, wed, thu, fri, sat, sun]
      start: "02:00"
      end: "06:00"
  timezone: "Europe/Berlin"

title_filters:
  live:
    include: []
    exclude: ['(?i)\bxxx\b', '(?i)adult']
    match_category: false
  vod:
    include: []
    exclude: ['(?i)\bxxx\b']
    match_category: false
  series:
    include: []
    exclude: []
    match_category: false

audio_filters:
  vod:
    include: ['(?i)\b(ger|deu|german|deutsch)\b']
    exclude: []
  series:
    include: ['(?i)\b(ger|deu|german|deutsch)\b']
    exclude: []
  on_unknown: keep

# Per-category handling. Easiest to manage from the Web UI's "Categories"
# tab, which lists every category and writes the IDs back here.
#   excluded_ids       - category hidden entirely; crawler skips it.
#   always_deliver_ids - every title in the category delivered as-is
#                        (title + audio filters skipped) and not probed.
#                        Use when you're sure the whole category is in your
#                        target language. A category can't be in both.
category_filters:
  live:
    excluded_ids: []
    always_deliver_ids: []
  vod:
    excluded_ids: []
    always_deliver_ids: []
  series:
    excluded_ids: []
    always_deliver_ids: []
